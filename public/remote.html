<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Geo-Zebra Remote</title>
<link rel="manifest" href="/remote-manifest.json" />
<meta name="theme-color" content="#111317" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #111317; color: #e8eaed;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  /* 탭 바 */
  #tabs { display: flex; gap: 4px; padding: 6px 8px 0; background: #16181d;
    overflow-x: auto; white-space: nowrap; }
  #tabs::-webkit-scrollbar { height: 0; }
  .tab { display: inline-flex; align-items: center; gap: 6px; max-width: 200px;
    background: #23262e; color: #c5c8ce; border: 0; border-radius: 10px 10px 0 0;
    padding: 8px 10px; font-size: 13px; cursor: pointer; flex: 0 0 auto; }
  .tab.active { background: #2f333d; color: #fff; }
  .tab .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
  .tab .x { opacity: .6; font-size: 15px; line-height: 1; }
  .tab .x:hover { opacity: 1; }
  #newtab { flex: 0 0 auto; background: #23262e; color: #c5c8ce; border: 0;
    border-radius: 10px; padding: 8px 12px; font-size: 16px; cursor: pointer; }
  /* 툴바 */
  #bar { display: flex; gap: 6px; padding: 8px; align-items: center; background: #1b1e24; }
  #bar button { background: #2a2e36; color: #e8eaed; border: 0; border-radius: 8px;
    padding: 8px 10px; font-size: 15px; cursor: pointer; }
  #bar button:active { background: #3a3f49; }
  #url { flex: 1; min-width: 0; background: #0d0f13; color: #e8eaed; border: 1px solid #333;
    border-radius: 8px; padding: 9px 12px; font-size: 15px; }
  #stage { position: relative; width: 100%; height: calc(100% - 96px);
    display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100%; max-height: 100%; background: #000; outline: none; touch-action: none; }
  #status { position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.7); padding: 6px 14px; border-radius: 20px; font-size: 13px;
    pointer-events: none; transition: opacity .3s; }
  #status.hide { opacity: 0; }
</style>
</head>
<body>
  <div id="tabs"><button id="newtab" title="새 탭">＋</button></div>
  <div id="bar">
    <button id="back" title="뒤로">◀</button>
    <button id="fwd" title="앞으로">▶</button>
    <button id="reload" title="새로고침">⟳</button>
    <input id="url" placeholder="주소 입력 후 Enter" />
    <button id="sound" title="소리 켜기">🔇</button>
  </div>
  <div id="stage">
    <canvas id="screen" width="1280" height="720" tabindex="0"></canvas>
    <input id="kbd" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"
      style="position:fixed; left:-9999px; top:0; width:1px; height:1px; opacity:0;" />
    <div id="status">연결 중…</div>
  </div>

<script>
const WIDTH = 1280, HEIGHT = 720;
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const urlBar = document.getElementById('url');
const statusEl = document.getElementById('status');
const tabsEl = document.getElementById('tabs');
const newtabBtn = document.getElementById('newtab');

let ws = null, reconnectDelay = 500;

function setStatus(text, autohide) {
  statusEl.textContent = text;
  statusEl.classList.remove('hide');
  if (autohide) setTimeout(() => statusEl.classList.add('hide'), 800);
}

// ── 탭 바 렌더링 ──
function renderTabs(list, activeId) {
  // 기존 탭 칩 제거 ('+' 버튼은 유지)
  [...tabsEl.querySelectorAll('.tab')].forEach((el) => el.remove());
  for (const t of list) {
    const chip = document.createElement('div');
    chip.className = 'tab' + (t.active ? ' active' : '');
    const label = document.createElement('span');
    label.className = 't';
    label.textContent = t.title || '새 탭';
    chip.appendChild(label);
    const x = document.createElement('span');
    x.className = 'x';
    x.textContent = '×';
    x.onclick = (e) => { e.stopPropagation(); send({ type: 'closetab', id: t.id }); };
    chip.appendChild(x);
    chip.onclick = () => { send({ type: 'switchtab', id: t.id }); kbd.focus(); };
    tabsEl.insertBefore(chip, newtabBtn);
    // 활성 탭 주소를 주소창에 (입력 중이 아닐 때만)
    if (t.active && document.activeElement !== urlBar) urlBar.value = t.url;
  }
}
newtabBtn.onclick = () => { send({ type: 'newtab' }); kbd.focus(); };

// ── WebSocket 연결 + 자동 재연결 ──
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/remote`);
  ws.onopen = () => { reconnectDelay = 500; setStatus('연결됨', true); kbd.focus(); };
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'frame') {
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0, WIDTH, HEIGHT);
      img.src = 'data:image/jpeg;base64,' + msg.data;
    } else if (msg.type === 'tabs') {
      renderTabs(msg.tabs, msg.activeId);
    } else if (msg.type === 'cursor') {
      canvas.style.cursor = msg.cursor || 'default';
    }
  };
  ws.onclose = () => {
    setStatus('연결 끊김 — 재연결 중…');
    setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 1.6, 5000);
  };
  ws.onerror = () => { try { ws.close(); } catch (_) {} };
}
connect();

function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

// ── 좌표 변환 (표시 크기 → 서버 1280x720) ──
function coords(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: Math.round((e.clientX - r.left) * (WIDTH / r.width)),
    y: Math.round((e.clientY - r.top) * (HEIGHT / r.height)),
  };
}

// ── 포인터 입력 (마우스·터치·터치패드 통합) ──
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  kbd.focus();
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  const { x, y } = coords(e);
  send({ type: 'down', x, y, button: e.button === 2 ? 'right' : 'left' });
});
canvas.addEventListener('pointerup', (e) => {
  const { x, y } = coords(e);
  send({ type: 'up', x, y, button: e.button === 2 ? 'right' : 'left' });
});
let lastMove = 0;
canvas.addEventListener('pointermove', (e) => {
  const now = Date.now();
  if (now - lastMove < 40) return;
  lastMove = now;
  const { x, y } = coords(e);
  send({ type: 'move', x, y });
});
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  send({ type: 'wheel', dx: e.deltaX, dy: e.deltaY });
}, { passive: false });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

// ── 키보드 (한글 IME 지원: 숨은 입력창에서 조합 → 결과만 전송) ──
const kbd = document.getElementById('kbd');
let composing = false;
kbd.addEventListener('compositionstart', () => { composing = true; });
kbd.addEventListener('compositionend', (e) => {
  composing = false;
  if (e.data) send({ type: 'text', text: e.data });  // 완성된 한글 등
  kbd.value = '';
});
kbd.addEventListener('input', () => {
  if (composing) return;                 // 조합 중엔 compositionend가 처리
  if (kbd.value) { send({ type: 'text', text: kbd.value }); kbd.value = ''; }  // 영문/숫자/기호
});
kbd.addEventListener('keydown', (e) => {
  if (e.isComposing) return;             // IME 조합 중 특수키 무시
  if (['Enter','Backspace','Tab','Delete','Escape','ArrowLeft','ArrowRight',
       'ArrowUp','ArrowDown','Home','End','PageUp','PageDown'].includes(e.key)) {
    e.preventDefault();
    send({ type: 'press', key: e.key });
  }
});

// ── 툴바 ──
document.getElementById('back').onclick = () => { send({ type: 'back' }); kbd.focus(); };
document.getElementById('fwd').onclick = () => { send({ type: 'forward' }); kbd.focus(); };
document.getElementById('reload').onclick = () => { send({ type: 'reload' }); kbd.focus(); };
urlBar.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    let u = urlBar.value.trim();
    if (!/^https?:\/\//.test(u)) u = 'https://' + u;
    send({ type: 'navigate', url: u });
    kbd.focus();
  }
});

// ── 소리 (원격 브라우저 오디오를 크롬북에서 재생, 오멘에서는 안 남) ──
let audioCtx = null, audioWs = null, nextTime = 0, leftover = new Uint8Array(0), soundOn = false;
const soundBtn = document.getElementById('sound');
soundBtn.onclick = () => { soundOn ? stopAudio() : startAudio(); };
function startAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
  audioCtx.resume();
  nextTime = audioCtx.currentTime;
  leftover = new Uint8Array(0);
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  audioWs = new WebSocket(`${proto}://${location.host}/audio`);
  audioWs.binaryType = 'arraybuffer';
  audioWs.onmessage = (ev) => {
    const inc = new Uint8Array(ev.data);
    const merged = new Uint8Array(leftover.length + inc.length);
    merged.set(leftover); merged.set(inc, leftover.length);
    const usable = merged.length - (merged.length % 4);
    leftover = merged.slice(usable);
    if (!usable) return;
    const i16 = new Int16Array(merged.buffer, 0, usable / 2);
    const frames = usable / 4;
    const buf = audioCtx.createBuffer(2, frames, 48000);
    const L = buf.getChannelData(0), R = buf.getChannelData(1);
    for (let i = 0; i < frames; i++) { L[i] = i16[i*2] / 32768; R[i] = i16[i*2+1] / 32768; }
    const src = audioCtx.createBufferSource();
    src.buffer = buf; src.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if (nextTime < now) nextTime = now + 0.05;             // 끊김(언더런) → 살짝 앞서 재생
    else if (nextTime - now > 0.30) nextTime = now + 0.05; // 버퍼 과다(화면보다 밀림) → 밀린 소리 버리고 따라잡기
    src.start(nextTime);
    nextTime += buf.duration;
  };
  soundOn = true; soundBtn.textContent = '🔊'; soundBtn.title = '소리 끄기';
}
function stopAudio() {
  if (audioWs) { try { audioWs.close(); } catch (_) {} audioWs = null; }
  if (audioCtx) { try { audioCtx.close(); } catch (_) {} audioCtx = null; }
  leftover = new Uint8Array(0); soundOn = false;
  soundBtn.textContent = '🔇'; soundBtn.title = '소리 켜기';
}

// ── PWA ──
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/remote-sw.js').catch(() => {});
</script>
</body>
</html>
